<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,interactive-widget=resizes-content"
    />
    <title>Wall paint studio · Tintfolio</title>
    <meta
      name="description"
      content="Try wall, ceiling and feature colours in three illustrated rooms."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wall paint studio · Tintfolio" />
    <meta
      property="og:description"
      content="Try wall, ceiling and feature colours in three illustrated rooms."
    />
    <meta property="og:image" content="/paint-preview.png" />
    <meta property="og:image:alt" content="Wall paint studio preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <script type="module" src="/src/app.ts"></script>
  </head>
  <body data-tool="paint">
    <a class="skip" href="#studio">Skip to editor</a>
    <header>
      <div class="wrap top">
        <a class="brand" href="/paint/"
          ><img src="/mark.svg" alt="" width="34" height="34" />Tintfolio</a
        >
        <nav aria-label="Colour editors">
          <a href="/paint/" aria-current="page">Wall paint</a
          ><a href="/web/">Website colours</a>
        </nav>
        <div class="actions">
          <button type="button" id="saved-open" class="outline" aria-haspopup="dialog">Saved swatches</button>
          <button type="button" id="share" class="outline">Share</button>
          <div class="paint-actions">
            <button type="button" id="paint-more" class="outline" aria-expanded="false" aria-controls="paint-extra-actions">More<span class="disclosure-chevron" aria-hidden="true"></span></button>
            <div id="paint-extra-actions">
              <button type="button" id="sheet-open" class="outline" aria-haspopup="dialog">Paint spec sheet</button>
              <button type="button" id="photo-open" class="outline" aria-haspopup="dialog">Tint a photo</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="wrap">
      <h1 class="sr">Wall paint</h1>
      <div id="share-result"></div>
      <p id="notice" role="status" hidden></p>
      <div id="studio" tabindex="-1"></div>
    </main>
    <footer class="wrap" aria-label="Pairing guide">
      <p class="pairing route-links"><strong>Pairing guide</strong> <a href="/wall-paint/sage-green-and-warm-cream-living-room">Sage green and warm cream for a living room</a></p>
    </footer>
  </body>
</html>
