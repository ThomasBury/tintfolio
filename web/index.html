<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,interactive-widget=resizes-content"
    />
    <title>Website colours studio · Tintfolio</title>
    <meta
      name="description"
      content="Build light and dark website palettes, check contrast, and export colours."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Website colours studio · Tintfolio" />
    <meta
      property="og:description"
      content="Build light and dark website palettes, check contrast, and export colours."
    />
    <meta property="og:image" content="/web-preview.png" />
    <meta property="og:image:alt" content="Website colours studio preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <script type="module" src="/src/app.ts"></script>
  </head>
  <body data-tool="web">
    <a class="skip" href="#studio">Skip to editor</a>
    <header>
      <div class="wrap top">
        <a class="brand" href="/paint/"
          ><img src="/mark.svg" alt="" width="34" height="34" />Tintfolio</a
        >
        <nav aria-label="Colour editors">
          <a href="/paint/">Wall paint</a
          ><a href="/web/" aria-current="page">Website colours</a>
        </nav>
        <div class="actions">
          <button type="button" id="saved-open" class="outline" aria-haspopup="dialog">Saved swatches</button>
          <button type="button" id="share" class="outline">Share</button>
          <button type="button" id="export-open" class="outline" aria-haspopup="dialog">Export theme</button>
        </div>
      </div>
    </header>
    <main class="wrap">
      <h1 class="sr">Website colours</h1>
      <div id="share-result"></div>
      <p id="notice" role="status" hidden></p>
      <div id="studio" tabindex="-1"></div>
    </main>
  </body>
</html>
